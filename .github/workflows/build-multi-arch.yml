name: Build & Push - multi-arch

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile-multi-arch'
  # Les PR ne construisent ni ne publient d'image : elles font tourner
  # les jobs de validation. Sans cela, une PR ne touchant que
  # .github/workflows/** (typiquement Dependabot) serait mergeable sans
  # qu'aucune CI n'ait validé les nouvelles versions d'actions.
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 1 * *" # chaque 1er du mois à 03h00 UTC
  workflow_dispatch:

concurrency:
  group: build-multi-arch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6
        with:
          dockerfile: Dockerfile-multi-arch
          failure-threshold: error

  test:
    name: Test d'intégration (${{ matrix.arch }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # Une architecture en échec ne doit pas masquer l'état de l'autre.
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # L'arm64 est construit et exécuté sous émulation. Sans lui, la
      # moitié de ce qui est publié n'aurait jamais vu un processus
      # démarrer : l'arm64 partait vers les registres sur la seule foi
      # de sa compilation.
      - name: Set up QEMU (émulation arm64)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image de test (${{ matrix.arch }}, local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-multi-arch
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: bionic-test:ci

      # Les tests ci-dessous ne précisent pas de plateforme : ils portent
      # sur l'unique image locale. On vérifie donc que c'est bien celle
      # qu'on croit, faute de quoi le job arm64 testerait de l'amd64 tout
      # en affichant une couverture des deux.
      - name: L'image construite est bien en ${{ matrix.arch }}
        run: |
          ARCH=$(docker image inspect --format '{{.Architecture}}' bionic-test:ci)
          echo "architecture de l'image = ${ARCH}"
          test "${ARCH}" = "${{ matrix.arch }}"

      # Cette image n'a pas de système d'init : le CMD devient PID 1.
      # C'est ce que documente la section « Processus et signaux », et
      # c'est la différence de fond avec la variante s6-overlay.
      - name: Le CMD est bien PID 1 (aucun init interposé)
        run: |
          PID1=$(docker run --rm bionic-test:ci sh -c 'cat /proc/1/comm')
          echo "PID 1 = ${PID1}"
          test "${PID1}" = "sh"

      - name: Le CMD par défaut est /bin/bash
        run: |
          CMD=$(docker image inspect --format '{{json .Config.Cmd}}' bionic-test:ci)
          echo "CMD = ${CMD}"
          test "${CMD}" = '["/bin/bash"]'

      # Propriété centrale de cette image : contrairement à la variante
      # s6-overlay, aucun processus ne tourne en root, PID 1 compris.
      - name: Le conteneur tourne en appuser, jamais en root
        run: |
          OUT=$(docker run --rm bionic-test:ci id -un)
          UID_=$(docker run --rm bionic-test:ci id -u)
          echo "utilisateur = ${OUT} (uid ${UID_})"
          test "${OUT}" = "appuser"
          test "${UID_}" = "1000"

      - name: HOME vaut /config et /config est inscriptible
        run: |
          OUT=$(docker run --rm bionic-test:ci sh -c 'echo "$HOME"')
          echo "HOME = ${OUT}"
          test "${OUT}" = "/config"
          docker run --rm bionic-test:ci sh -c 'touch /config/preuve && test -f /config/preuve'

      - name: /config appartient à appuser en mode 750
        run: |
          OUT=$(docker run --rm bionic-test:ci stat -c '%U:%G %a' /config)
          echo "/config = ${OUT}"
          test "${OUT}" = "appuser:appuser 750"

      - name: Le code de sortie du CMD est propagé au conteneur
        run: |
          set +e
          docker run --rm bionic-test:ci sh -c 'exit 42'
          CODE=$?
          set -e
          echo "code de sortie = ${CODE}"
          test "${CODE}" -eq 42

      # Exécuté en root (-u 0) : appuser ne peut pas traverser /root, et
      # un balayage incomplet donnerait un faux négatif rassurant.
      - name: Aucun binaire SUID/SGID ne subsiste
        run: |
          N=$(docker run --rm -u 0 bionic-test:ci \
                find / -xdev -type f \( -perm -4000 -o -perm -2000 \) -print 2>/dev/null | wc -l)
          echo "binaires SUID/SGID restants = ${N}"
          test "${N}" -eq 0

      - name: La locale en_US.UTF-8 est générée
        run: |
          docker run --rm bionic-test:ci sh -c 'locale -a' | tr -d '\r' | grep -qix 'en_US.utf8'
          echo "locale en_US.utf8 présente"

      - name: Le fuseau horaire par défaut est UTC
        run: |
          OUT=$(docker run --rm bionic-test:ci date +%Z)
          echo "fuseau = ${OUT}"
          test "${OUT}" = "UTC"

  build-multi-arch:
    needs: test
    # Ne jamais publier depuis une PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tag
        id: version
        run: |
          TAG=$(date -u +'%Y.%m')
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-multi-arch
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            REPO_URL=https://github.com/${{ github.repository }}
            AUTHORS=Sam Tech Lab
            TITLE=Ubuntu 18.04 (Bionic) Base
            DESCRIPTION=Image Ubuntu 18.04 légère, durcie et multi-architecture
            VERSION=18.04
            LICENSES=MIT
          tags: |
            samtechlab/ubuntu-18.04-bionic:latest
            samtechlab/ubuntu-18.04-bionic:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor="Sam Tech Lab"
            org.opencontainers.image.url="https://hub.docker.com/r/samtechlab/ubuntu-18.04-bionic"

      - name: Build and push multi-arch to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-multi-arch
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            REPO_URL=https://github.com/${{ github.repository }}
            AUTHORS=Sam Tech Lab
            TITLE=Ubuntu 18.04 (Bionic) Base
            DESCRIPTION=Image Ubuntu 18.04 légère, durcie et multi-architecture
            VERSION=18.04
            LICENSES=MIT
          tags: |
            ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest
            ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor="Sam Tech Lab"
            org.opencontainers.image.url="https://ghcr.io/${{ github.repository_owner }}/ubuntu-18.04-bionic"

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: samtechlab/ubuntu-18.04-bionic
          readme-filepath: ./README.md